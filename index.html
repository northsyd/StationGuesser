<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Guesser</title>
  <script src="stations.js"></script>
  <style>
    :root {
      --bg: #07111f; --panel: rgba(255,255,255,.08); --panel2: rgba(255,255,255,.13);
      --text: #f7fbff; --muted: #b7c5d6; --line: rgba(255,255,255,.16);
      --accent: #65d0ff; --accent2: #7cffb2; --danger: #ff7a7a; --warn: #ffd166;
      --shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(101,208,255,.24),transparent 34rem),radial-gradient(circle at bottom right,rgba(124,255,178,.16),transparent 30rem),linear-gradient(135deg,#07111f 0%,#0d1e32 55%,#06101c 100%)}
    .shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:32px 0 48px} header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06111d;font-weight:900;box-shadow:var(--shadow)}
    h1,h2,p{margin:0} h1{font-size:clamp(2rem,4vw,3.6rem);letter-spacing:-.06em}.subtitle{color:var(--muted);margin-top:4px}.top-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);padding:10px 13px;border-radius:999px;color:var(--muted);font-size:.94rem}.pill strong{color:var(--text)}
    .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:18px}.card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.game{padding:clamp(20px,4vw,36px)}
    .prompt{min-height:260px;display:grid;place-items:center;text-align:center;border:1px dashed rgba(255,255,255,.22);background:linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:42px 42px;border-radius:24px;margin-bottom:22px;position:relative;overflow:hidden}.prompt:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(101,208,255,.16);filter:blur(16px);top:-80px;right:-70px}.question-mark{font-size:clamp(4rem,10vw,8rem);line-height:1;font-weight:900;color:var(--accent);text-shadow:0 0 38px rgba(101,208,255,.35)}.hint-line{color:var(--muted);margin-top:10px;font-size:1.05rem}.answer-line{font-size:1.3rem;font-weight:900;margin-top:8px}
    .input-row,.select-row{display:flex;gap:10px;margin-bottom:12px} input,select{border:1px solid var(--line);background:rgba(3,10,19,.55);color:var(--text);border-radius:16px;padding:15px 16px;font-size:1rem;outline:none} input{flex:1} select{min-width:150px} input:focus,select:focus{border-color:rgba(101,208,255,.75)} button{border:0;border-radius:16px;padding:14px 18px;font-weight:800;cursor:pointer;color:#06111d;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .15s ease,opacity .15s ease} button:hover{transform:translateY(-1px)} button:active{transform:translateY(0)} button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)} button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}.message{min-height:30px;margin:12px 0;color:var(--muted)}.message.good{color:var(--accent2)}.message.bad{color:var(--danger)}.message.warn{color:var(--warn)}
    aside{padding:24px}.side-section+.side-section{border-top:1px solid var(--line);margin-top:22px;padding-top:22px}h2{font-size:1.05rem;margin-bottom:12px;letter-spacing:-.02em}.hints,.history{display:grid;gap:10px}.hint,.history-item{border:1px solid var(--line);background:rgba(255,255,255,.06);padding:12px;border-radius:16px;color:var(--muted)}.hint strong{color:var(--text);display:block;margin-bottom:2px}.history{max-height:360px;overflow:auto;padding-right:3px}.history-item{display:grid;gap:5px;font-size:.92rem}.history-top{display:flex;justify-content:space-between;gap:12px}.answer{color:var(--text);font-weight:800}.small{font-size:.86rem;color:var(--muted)}footer{color:var(--muted);text-align:center;margin-top:22px;font-size:.92rem}
    @media(max-width:820px){header{align-items:flex-start;flex-direction:column}.top-stats{justify-content:flex-start}.grid{grid-template-columns:1fr}.input-row,.select-row{flex-direction:column}button,select{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="logo">SG</div><div><h1>Station Guesser</h1><p class="subtitle">Guess the mystery station from NSW or Victoria.</p></div></div>
      <div class="top-stats"><div class="pill">Guesses: <strong id="guesses">0</strong></div><div class="pill">Hints: <strong id="hintsUsed">0</strong></div><div class="pill">Loaded: <strong id="loaded">0</strong></div></div>
    </header>
    <section class="grid">
      <div class="card game">
        <div class="prompt" aria-live="polite"><div><div class="question-mark" id="bigMark">?</div><p class="hint-line" id="mainHint">A station has been chosen. Start guessing.</p><p class="answer-line" id="answerLine"></p></div></div>
        <div class="select-row"><select id="region"><option value="any">Any region</option><option value="nsw">NSW only</option><option value="vic">VIC only</option></select><button class="secondary" id="applyRegion">Apply region / new round</button></div>
        <div class="input-row"><input id="guessInput" list="stationList" type="text" placeholder="Type a station name… e.g. Central" autocomplete="off" /><datalist id="stationList"></datalist><select id="guessState"><option value="NSW">NSW</option><option value="VIC">VIC</option></select><button id="submitBtn">Guess</button></div>
        <p class="message" id="message"></p>
        <div class="actions"><button class="secondary" id="hintBtn">Reveal hint</button><button class="secondary" id="skipBtn">Skip</button><button id="newBtn">New station</button></div>
      </div>
      <aside class="card"><div class="side-section"><h2>Hints</h2><div class="hints" id="hints"></div></div><div class="side-section"><h2>Previous guesses</h2><div class="history" id="history"></div></div></aside>
    </section>
    <footer>Static GitHub Pages version — no Express server needed. Full dataset goes in <code>stations.js</code>.</footer>
  </main>
<script>
const STORAGE_KEY = "station-guesser-state-v2";
const ALL_STATIONS = (window.ALL_STATIONS || []).filter(s => s && s.name && Number.isFinite(+s.lat) && Number.isFinite(+s.lon) && s.state);
let state = loadState() || freshState("any");
const $ = id => document.getElementById(id);
const els = { guesses:$("guesses"), hintsUsed:$("hintsUsed"), loaded:$("loaded"), bigMark:$("bigMark"), mainHint:$("mainHint"), answerLine:$("answerLine"), region:$("region"), applyRegion:$("applyRegion"), input:$("guessInput"), datalist:$("stationList"), guessState:$("guessState"), submit:$("submitBtn"), message:$("message"), hint:$("hintBtn"), skip:$("skipBtn"), next:$("newBtn"), hints:$("hints"), history:$("history") };
function haversineKm(lat1, lon1, lat2, lon2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function directionHint(km){if(km<1)return"You're very close!";if(km<10)return"Getting warm!";if(km<50)return"Not too far.";if(km<200)return"Quite a distance away.";return"Very far away!";}
function pool(region=state.region){return region==="any"?ALL_STATIONS:ALL_STATIONS.filter(s=>String(s.state).toLowerCase()===region);}
function pickStation(region){const p=pool(region);return p[Math.floor(Math.random()*p.length)] || ALL_STATIONS[0];}
function hintsFor(station){return [`Network: ${station.state}`,`First letter: ${station.name[0]}`,`Number of letters: ${station.name.replace(/ /g,"").length} (excluding spaces)`,`Transport mode: ${station.mode}`,`Station name starts with: ${station.name.slice(0,3)}...`];}
function freshState(region){return {target:pickStation(region), guesses:0, hintsUsed:0, revealedHints:[], region, solved:false, skipped:false, previousGuesses:[]};}
function saveState(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(!s || !s.target || !ALL_STATIONS.length) return null; const match=ALL_STATIONS.find(x=>x.name===s.target.name && x.state===s.target.state); return match ? {...s,target:match} : null;}catch{return null;}}
function setMessage(text,type=""){els.message.textContent=text;els.message.className=`message ${type}`;}
function normalise(v){return String(v).trim().toLowerCase().replace(/\s+railway station$/,'').replace(/\s+station$/,'').replace(/[^a-z0-9]/g,'');}
function newRound(region=state.region){state=freshState(region);setMessage("New station chosen.");render();saveState();els.input.focus();}
function renderDatalist(){const p=pool(); els.datalist.innerHTML=p.map(s=>`<option value="${escapeHtml(s.name)}"></option>`).join("");}
function render(){els.loaded.textContent=ALL_STATIONS.length; els.guesses.textContent=state.guesses; els.hintsUsed.textContent=state.hintsUsed; els.region.value=state.region; els.guessState.value=state.region==="vic"?"VIC":"NSW"; renderDatalist();
  els.answerLine.textContent=(state.solved||state.skipped)?`${state.target.name}, ${state.target.state} (${state.target.mode})`:""; els.bigMark.textContent=state.solved?"✓":state.skipped?"↷":"?"; els.mainHint.textContent=state.solved?"Correct! Start a new round.":state.skipped?"Skipped. Start a new round.":"Mystery station selected.";
  els.submit.disabled=state.solved||state.skipped; els.hint.disabled=state.solved||state.skipped; els.skip.disabled=state.solved||state.skipped;
  els.hints.innerHTML=state.revealedHints.length?state.revealedHints.map((h,i)=>`<div class="hint"><strong>Hint ${i+1}</strong>${escapeHtml(h)}</div>`).join(""):`<div class="hint">No hints revealed yet.</div>`;
  els.history.innerHTML=state.previousGuesses.length?state.previousGuesses.map(g=>`<div class="history-item"><div class="history-top"><span class="answer">${escapeHtml(g.station.name)}, ${g.station.state}</span><span>${g.correct?"✅":"❌"}</span></div><div>${g.distance_km} km away — ${escapeHtml(g.direction_hint)}</div><div class="small">${escapeHtml(g.station.mode)}</div></div>`).join(""):`<div class="hint">No guesses yet.</div>`;
}
function guess(){if(state.solved||state.skipped)return; const name=els.input.value; const guessState=els.guessState.value; const guessStation=ALL_STATIONS.find(s=>normalise(s.name)===normalise(name)&&String(s.state).toUpperCase()===guessState); if(!guessStation){setMessage(`Station "${name}, ${guessState}" not found. Check spelling and network.`,"bad");return;} state.guesses++; const correct=normalise(guessStation.name)===normalise(state.target.name)&&guessStation.state===state.target.state; const dist=Math.round(haversineKm(+guessStation.lat,+guessStation.lon,+state.target.lat,+state.target.lon)*10)/10; const hint=directionHint(dist); state.previousGuesses.unshift({station:{name:guessStation.name,state:guessStation.state,mode:guessStation.mode},distance_km:dist,direction_hint:hint,correct}); if(correct){state.solved=true;setMessage(`Correct! The station was ${state.target.name}, ${state.target.state}.`,"good");}else{setMessage(`${guessStation.name}, ${guessStation.state} is ${dist} km from the target. ${hint}`,"bad");} els.input.value=""; render(); saveState();}
function revealHint(){if(state.solved||state.skipped)return; const hints=hintsFor(state.target); if(state.hintsUsed>=hints.length){setMessage("No more hints! Try your best guess.","warn");return;} state.revealedHints.push(hints[state.hintsUsed]); state.hintsUsed++; setMessage(`Hint ${state.hintsUsed} revealed.`); render(); saveState();}
function skip(){if(state.solved||state.skipped)return; state.skipped=true; setMessage(`Skipped! The station was ${state.target.name}, ${state.target.state} (${state.target.mode}).`,"warn"); render(); saveState();}
function escapeHtml(str){return String(str).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
els.submit.addEventListener("click",guess); els.input.addEventListener("keydown",e=>{if(e.key==="Enter")guess();}); els.hint.addEventListener("click",revealHint); els.skip.addEventListener("click",skip); els.next.addEventListener("click",()=>newRound()); els.applyRegion.addEventListener("click",()=>newRound(els.region.value));
if(!ALL_STATIONS.length){setMessage("No station data loaded. Add stations to stations.js.","bad");} else {render();}
</script>
</body>
</html>
