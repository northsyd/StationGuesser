<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Guesser</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.13);
      --text: #f7fbff;
      --muted: #b7c5d6;
      --line: rgba(255, 255, 255, 0.16);
      --accent: #65d0ff;
      --accent2: #7cffb2;
      --danger: #ff7a7a;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(101, 208, 255, 0.24), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(124, 255, 178, 0.16), transparent 30rem),
        linear-gradient(135deg, #07111f 0%, #0d1e32 55%, #06101c 100%);
    }

    .shell {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      color: #06111d;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2rem, 4vw, 3.6rem); letter-spacing: -0.06em; }
    .subtitle { color: var(--muted); margin-top: 4px; }

    .top-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      padding: 10px 13px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .pill strong { color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
      gap: 18px;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .game {
      padding: clamp(20px, 4vw, 36px);
    }

    .prompt {
      min-height: 290px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px dashed rgba(255,255,255,0.22);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      border-radius: 24px;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .prompt::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(101, 208, 255, 0.16);
      filter: blur(16px);
      top: -80px;
      right: -70px;
    }

    .question-mark {
      font-size: clamp(4rem, 10vw, 8rem);
      line-height: 1;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 38px rgba(101, 208, 255, 0.35);
    }

    .hint-line {
      color: var(--muted);
      margin-top: 10px;
      font-size: 1.05rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(3, 10, 19, 0.55);
      color: var(--text);
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: rgba(101, 208, 255, 0.75); }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      font-weight: 800;
      cursor: pointer;
      color: #06111d;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.secondary {
      background: var(--panel-strong);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .message {
      min-height: 30px;
      margin: 12px 0;
      color: var(--muted);
    }

    .message.good { color: var(--accent2); }
    .message.bad { color: var(--danger); }

    aside { padding: 24px; }

    .side-section + .side-section {
      border-top: 1px solid var(--line);
      margin-top: 22px;
      padding-top: 22px;
    }

    h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .hints {
      display: grid;
      gap: 10px;
    }

    .hint {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 16px;
      color: var(--muted);
    }

    .hint strong { color: var(--text); display: block; margin-bottom: 2px; }

    .history {
      display: grid;
      gap: 8px;
      max-height: 300px;
      overflow: auto;
      padding-right: 3px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      padding: 10px 12px;
      border-radius: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .answer { color: var(--text); font-weight: 700; }

    footer {
      color: var(--muted);
      text-align: center;
      margin-top: 22px;
      font-size: 0.92rem;
    }

    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      .top-stats { justify-content: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .input-row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="logo">SG</div>
        <div>
          <h1>Station Guesser</h1>
          <p class="subtitle">Guess the Sydney station from the hints.</p>
        </div>
      </div>
      <div class="top-stats">
        <div class="pill">Score: <strong id="score">0</strong></div>
        <div class="pill">Streak: <strong id="streak">0</strong></div>
        <div class="pill">Round: <strong id="round">1</strong></div>
      </div>
    </header>

    <section class="grid">
      <div class="card game">
        <div class="prompt" aria-live="polite">
          <div>
            <div class="question-mark">?</div>
            <p class="hint-line" id="mainHint">Press “New station” to begin.</p>
          </div>
        </div>

        <div class="input-row">
          <input id="guessInput" type="text" placeholder="Type a station name…" autocomplete="off" />
          <button id="submitBtn">Guess</button>
        </div>

        <p class="message" id="message"></p>

        <div class="actions">
          <button class="secondary" id="hintBtn">Reveal hint</button>
          <button class="secondary" id="skipBtn">Skip</button>
          <button id="newBtn">New station</button>
        </div>
      </div>

      <aside class="card">
        <div class="side-section">
          <h2>Hints</h2>
          <div class="hints" id="hints"></div>
        </div>
        <div class="side-section">
          <h2>Recent rounds</h2>
          <div class="history" id="history"></div>
        </div>
      </aside>
    </section>

    <footer>
      Static GitHub Pages version. Edit the station list in the script at the bottom of this file.
    </footer>
  </main>

  <script>
    const stations = [
      { name: "Central", lines: "T1, T2, T3, T4, T8, T9, Intercity, Metro", area: "Sydney CBD", clue: "The biggest railway interchange in NSW." },
      { name: "Town Hall", lines: "T1, T2, T3, T4, T8, T9", area: "Sydney CBD", clue: "A very busy underground city station near George Street." },
      { name: "Wynyard", lines: "T1, T2, T3, T8, T9", area: "Sydney CBD", clue: "North Shore trains pass through here before the Harbour Bridge." },
      { name: "Milsons Point", lines: "T1", area: "Lower North Shore", clue: "Right by Luna Park and the northern end of the Harbour Bridge." },
      { name: "North Sydney", lines: "T1", area: "Lower North Shore", clue: "Major business district station with old unused rail stubs nearby." },
      { name: "St Leonards", lines: "T1", area: "Lower North Shore", clue: "Close to Royal North Shore Hospital and Crows Nest." },
      { name: "Chatswood", lines: "T1, Metro", area: "North Shore", clue: "A key interchange between Sydney Trains and Sydney Metro." },
      { name: "Epping", lines: "T9, Metro", area: "Northern Sydney", clue: "Interchange station with a deep underground metro section." },
      { name: "Strathfield", lines: "T1, T2, T9, Intercity", area: "Inner West", clue: "A major western interchange with lots of platforms." },
      { name: "Parramatta", lines: "T1, T5, Intercity", area: "Western Sydney", clue: "The main railway station for Sydney’s second CBD." },
      { name: "Redfern", lines: "T1, T2, T3, T4, T8, T9", area: "Inner Sydney", clue: "One stop south of Central and close to Sydney Uni." },
      { name: "Sydenham", lines: "T4, T8, Metro", area: "Inner South", clue: "A major interchange becoming central to the Bankstown metro conversion." },
      { name: "Bondi Junction", lines: "T4", area: "Eastern Suburbs", clue: "The eastern terminus of the Eastern Suburbs railway." },
      { name: "Hurstville", lines: "T4", area: "St George", clue: "Large T4 centre with express trains and a shopping centre above." },
      { name: "Bankstown", lines: "T3 / Metro conversion", area: "South West Sydney", clue: "A major station on the line being converted to metro." },
      { name: "Lidcombe", lines: "T1, T2, T3, T7", area: "Western Sydney", clue: "The shuttle to Olympic Park starts here." },
      { name: "Olympic Park", lines: "T7", area: "Sydney Olympic Park", clue: "Built for big events and stadium crowds." },
      { name: "Gosford", lines: "Central Coast & Newcastle Line", area: "Central Coast", clue: "Major Central Coast station north of Sydney." },
      { name: "Wollongong", lines: "South Coast Line", area: "Illawarra", clue: "The main station of the Illawarra’s largest city." },
      { name: "Lysaghts", lines: "South Coast Line", area: "Illawarra", clue: "Tiny industrial station near Port Kembla steelworks." }
    ];

    let current = null;
    let revealed = 0;
    let score = 0;
    let streak = 0;
    let round = 1;
    const history = [];

    const els = {
      score: document.getElementById("score"),
      streak: document.getElementById("streak"),
      round: document.getElementById("round"),
      mainHint: document.getElementById("mainHint"),
      hints: document.getElementById("hints"),
      input: document.getElementById("guessInput"),
      message: document.getElementById("message"),
      history: document.getElementById("history"),
      submit: document.getElementById("submitBtn"),
      hint: document.getElementById("hintBtn"),
      skip: document.getElementById("skipBtn"),
      next: document.getElementById("newBtn")
    };

    function normalise(value) {
      return value.trim().toLowerCase().replace(/\s+station$/, "").replace(/[^a-z0-9]/g, "");
    }

    function updateStats() {
      els.score.textContent = score;
      els.streak.textContent = streak;
      els.round.textContent = round;
    }

    function renderHints() {
      const allHints = current ? [
        ["Area", current.area],
        ["Lines", current.lines],
        ["Clue", current.clue],
        ["First letter", current.name[0]],
        ["Length", `${current.name.length} letters`]
      ] : [];

      els.hints.innerHTML = allHints.slice(0, revealed).map(([label, value]) => `
        <div class="hint"><strong>${label}</strong>${value}</div>
      `).join("") || `<div class="hint">No hints revealed yet.</div>`;
    }

    function renderHistory() {
      els.history.innerHTML = history.slice(0, 8).map(item => `
        <div class="history-item">
          <span class="answer">${item.name}</span>
          <span>${item.result}</span>
        </div>
      `).join("") || `<div class="hint">No completed rounds yet.</div>`;
    }

    function newStation() {
      const previous = current?.name;
      do {
        current = stations[Math.floor(Math.random() * stations.length)];
      } while (stations.length > 1 && current.name === previous);
      revealed = 1;
      els.mainHint.textContent = "Guess this station.";
      els.input.value = "";
      els.input.focus();
      setMessage("", "");
      renderHints();
      updateStats();
    }

    function setMessage(text, type) {
      els.message.textContent = text;
      els.message.className = `message ${type || ""}`;
    }

    function checkGuess() {
      if (!current) newStation();
      const guess = normalise(els.input.value);
      if (!guess) {
        setMessage("Type a station first.", "bad");
        return;
      }
      if (guess === normalise(current.name)) {
        const points = Math.max(1, 6 - revealed);
        score += points;
        streak += 1;
        history.unshift({ name: current.name, result: `+${points}` });
        setMessage(`Correct — it was ${current.name}.`, "good");
        round += 1;
        renderHistory();
        updateStats();
        setTimeout(newStation, 850);
      } else {
        streak = 0;
        setMessage("Not quite. Try another guess or reveal a hint.", "bad");
        updateStats();
      }
    }

    function revealHint() {
      if (!current) newStation();
      if (revealed < 5) {
        revealed += 1;
        renderHints();
      } else {
        setMessage("All hints are already revealed.", "");
      }
    }

    function skipStation() {
      if (!current) newStation();
      history.unshift({ name: current.name, result: "Skipped" });
      streak = 0;
      round += 1;
      setMessage(`Skipped — it was ${current.name}.`, "");
      renderHistory();
      updateStats();
      setTimeout(newStation, 850);
    }

    els.submit.addEventListener("click", checkGuess);
    els.hint.addEventListener("click", revealHint);
    els.skip.addEventListener("click", skipStation);
    els.next.addEventListener("click", newStation);
    els.input.addEventListener("keydown", event => {
      if (event.key === "Enter") checkGuess();
    });

    renderHints();
    renderHistory();
    updateStats();
  </script>
</body>
</html>
